
name: Build SimpleUnlocker EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and publish
        run: dotnet publish source/SimpleUnlockerRemastered.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o output

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SimpleUnlocker-Remastered-5.4
          path: output/*.exe
