
name: Build SimpleUnlocker EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
          if (!$zip) { throw "ZIP archive not found" }
          Expand-Archive $zip.FullName -DestinationPath source -Force

      - name: Find project
        shell: pwsh
        run: |
          $project = Get-ChildItem source -Filter "*.csproj" -Recurse | Select-Object -First 1
          if (!$project) { throw "CSProj not found" }
          "PROJECT=$($project.FullName)" >> $env:GITHUB_ENV

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o output

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleUnlocker-EXE
          path: output/*.exe
